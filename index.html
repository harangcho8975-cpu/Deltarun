<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <meta name="theme-color" content="#1a1a2e" />
    <title>delta run</title>
    <style>
      html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #1a1a2e; }
      body { overscroll-behavior: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #game { width: 100vw; height: 100dvh; touch-action: none; }
      #game canvas { touch-action: none; display: block; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10;
        background: #1a1a2e; color: #fff; font: 600 20px/1.5 system-ui, sans-serif;
        align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">휴대폰을 가로로 돌려주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
